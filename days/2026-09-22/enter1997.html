<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8" /><meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Desk97</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; height: 100vh; overflow: hidden; font-family: Tahoma, "MS Sans Serif", sans-serif; }
    #splash {
      position: fixed; inset: 0; z-index: 50; background: #000; color: #0f0;
      font-family: "Courier New", monospace; padding: 40px 24px;
    }
    #splash p { margin: 0 0 8px; }
    #skip { margin-top: 24px; background: #c0c0c0; border: 2px outset #fff; padding: 4px 12px; cursor: pointer; color: #000; }
    .desk { height: 100%; background: teal; position: relative; }
    .icon { position: absolute; width: 76px; text-align: center; color: #fff; font-size: 11px; cursor: pointer; text-shadow: 1px 1px #000; }
    .icon .g { width: 32px; height: 32px; margin: 0 auto 4px; }
    .bar { position: absolute; left: 0; right: 0; bottom: 0; height: 28px; background: silver; border-top: 2px solid #fff; display: flex; align-items: center; gap: 6px; padding: 0 4px; }
    .start { height: 22px; padding: 0 8px; background: silver; border: 2px outset #fff; font-weight: 700; }
    .win {
      position: absolute; width: 340px; min-height: 180px; background: silver;
      border: 2px outset #fff; box-shadow: 2px 2px 0 #0004;
    }
    .ttl { height: 22px; background: navy; color: #fff; display: flex; align-items: center; padding: 0 6px; font-size: 12px; cursor: move; }
    .ttl .x { margin-left: auto; width: 16px; height: 14px; background: silver; color: #000; border: 1px outset #fff; text-align: center; line-height: 12px; cursor: pointer; }
    .win.on .ttl { background: #000080; }
    textarea { width: 100%; height: 200px; border: 2px inset #fff; resize: none; font: 13px "Courier New", monospace; }
    .amp { padding: 8px; }
    .eq { height: 40px; background: #111; color: #0f0; font: 11px monospace; padding: 6px; }
  </style>
</head>
<body>
  <div id="splash">
    <p>Connecting to the Internet...</p>
    <p id="log">ATDT 9,1-555-NETS</p>
    <button id="skip" type="button">Skip</button>
  </div>
  <div class="desk">
    <a class="lab" href="./index.html" style="position:absolute;top:8px;right:10px;color:#fff;font-size:11px">랩</a>
    <div class="icon" style="top:16px;left:16px" data-app="note"><div class="g" style="background:#fff;border:1px solid #000"></div>Notepad</div>
    <div class="icon" style="top:90px;left:16px" data-app="amp"><div class="g" style="background:#222;border:1px solid #0f0"></div>Winamp</div>
    <div class="icon" style="top:164px;left:16px"><div class="g" style="background:#888;border:1px solid #000"></div>Recycle</div>
    <div id="wins"></div>
    <div class="bar"><button class="start" type="button">Start</button><span id="clk" style="margin-left:auto;font-size:12px"></span></div>
  </div>
  <script>
    const splash = document.getElementById("splash");
    const lines = ["DIALING...", "CONNECT 33600", "PPP: connected", "Welcome to the Internet, 1997."];
    let li = 0;
    const tick = setInterval(() => {
      if (li < lines.length) document.getElementById("log").textContent += "\n" + lines[li++];
      else { clearInterval(tick); setTimeout(enter, 500); }
    }, 450);
    document.getElementById("skip").onclick = enter;
    function enter() { splash.remove(); }
    let z = 10;
    function openWin(kind) {
      const el = document.createElement("div");
      el.className = "win on";
      el.style.left = kind === "note" ? "120px" : "280px";
      el.style.top = "48px";
      el.style.zIndex = ++z;
      el.innerHTML = kind === "note"
        ? `<div class="ttl">Untitled - Notepad <span class="x">×</span></div><textarea id="np">${localStorage.getItem("desk97-note") || "Hello from 1997."}</textarea>`
        : `<div class="ttl">WINAMP <span class="x">×</span></div><div class="amp"><div class="eq" id="eq">♪  —  modem dream  —  128kbps</div><button type="button" id="play">Play</button></div>`;
      document.getElementById("wins").appendChild(el);
      el.querySelector(".x").onclick = () => el.remove();
      el.addEventListener("mousedown", () => { el.style.zIndex = ++z; document.querySelectorAll(".win").forEach((w) => w.classList.toggle("on", w === el)); });
      if (kind === "note") el.querySelector("textarea").oninput = (e) => localStorage.setItem("desk97-note", e.target.value);
      if (kind === "amp") {
        let t;
        el.querySelector("#play").onclick = () => {
          clearInterval(t);
          t = setInterval(() => {
            el.querySelector("#eq").textContent = "♪ " + Array.from({length: 16}, () => " ▂▃▅▇"[Math.random()*5|0]).join("");
          }, 120);
        };
      }
    }
    document.querySelectorAll("[data-app]").forEach((ic) => ic.onclick = () => openWin(ic.dataset.app));
    setInterval(() => { document.getElementById("clk").textContent = new Date().toLocaleTimeString(); }, 1000);
  </script>
</body>
</html>
