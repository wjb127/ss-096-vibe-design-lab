<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8" /><meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Goo</title>
  <style>
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; background: #0b0c10; color: #eee; font-family: ui-sans-serif, system-ui, sans-serif; }
    a.lab { position: fixed; top: 10px; left: 12px; z-index: 20; color: #888; font-size: 11px; text-decoration: none; }
    canvas { display: block; width: 100%; height: 100%; }
    .strip { position: fixed; left: 16px; right: 16px; bottom: 18px; display: flex; gap: 8px; z-index: 10; flex-wrap: wrap; }
    button { height: 34px; padding: 0 12px; border-radius: 999px; border: 1px solid #333; background: #16171c; color: #eee; cursor: pointer; }
    .sheet { position: fixed; right: 16px; top: 48px; width: 240px; background: #16171ccc; backdrop-filter: blur(12px); border-radius: 12px; padding: 14px; display: none; z-index: 10; }
    .sheet.on { display: block; }
    label { display: block; font-size: 11px; color: #888; margin: 8px 0 4px; }
    input, select { width: 100%; }
    .name { position: fixed; left: 16px; top: 40px; font-size: 22px; letter-spacing: -0.04em; }
  </style>
</head>
<body>
  <a class="lab" href="./index.html">← 9/22</a>
  <div class="name" id="name">Goo</div>
  <div class="sheet" id="sheet">
    <label>Shape</label><input type="range" id="shape" min="0" max="2" step="0.01" value="0.6" />
    <label>Metal</label><input type="range" id="metal" min="0" max="1" step="0.01" value="0.8" />
    <label>Rough</label><input type="range" id="rough" min="0" max="1" step="0.01" value="0.12" />
    <label>Light</label><input type="color" id="light" value="#88ccff" />
  </div>
  <div class="strip">
    <button type="button" data-p="0">Pearl</button>
    <button type="button" data-p="1">Candy</button>
    <button type="button" data-p="2">Oil</button>
    <button type="button" id="remix">Remix</button>
    <button type="button" id="dl">PNG</button>
  </div>
  <script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.160.1/build/three.module.js"}}</script>
  <script type="module">
    import * as THREE from "three";
    const scene = new THREE.Scene();
    scene.background = new THREE.Color("#0b0c10");
    const cam = new THREE.PerspectiveCamera(40, innerWidth/innerHeight, 0.1, 50);
    cam.position.set(0, 0, 4.2);
    const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
    renderer.setSize(innerWidth, innerHeight); renderer.setPixelRatio(Math.min(2, devicePixelRatio));
    document.body.prepend(renderer.domElement);
    const geo = new THREE.SphereGeometry(1, 96, 96);
    const mat = new THREE.MeshStandardMaterial({ color: "#e8d0c4", metalness: 0.8, roughness: 0.12 });
    const mesh = new THREE.Mesh(geo, mat); scene.add(mesh);
    const key = new THREE.PointLight("#88ccff", 40, 20); key.position.set(2, 2, 3); scene.add(key);
    scene.add(new THREE.AmbientLight("#446", 0.6));
    scene.add(new THREE.PointLight("#ffaa88", 18, 20).translateX(-2).translateY(-1));
    const pos = geo.attributes.position; const base = pos.array.slice();
    let t = 0, dragging = false, lx = 0, ly = 0, rot = { x: 0.2, y: 0.4 };
    function deform() {
      const amp = +document.getElementById("shape").value;
      for (let i = 0; i < pos.count; i++) {
        const ix = i*3;
        const x = base[ix], y = base[ix+1], z = base[ix+2];
        const n = 1 + amp * 0.18 * Math.sin(x*4+t) * Math.cos(y*5+t*0.7);
        pos.array[ix]=x*n; pos.array[ix+1]=y*n; pos.array[ix+2]=z*n;
      }
      pos.needsUpdate = true; geo.computeVertexNormals();
    }
    function loop() {
      t += 0.012; deform();
      mesh.rotation.y = rot.y; mesh.rotation.x = rot.x;
      mat.metalness = +document.getElementById("metal").value;
      mat.roughness = +document.getElementById("rough").value;
      key.color.set(document.getElementById("light").value);
      renderer.render(scene, cam); requestAnimationFrame(loop);
    }
    loop();
    addEventListener("pointerdown", (e) => { dragging = true; lx = e.clientX; ly = e.clientY; });
    addEventListener("pointerup", () => dragging = false);
    addEventListener("pointermove", (e) => {
      if (!dragging) return;
      rot.y += (e.clientX - lx) * 0.005; rot.x += (e.clientY - ly) * 0.005; lx = e.clientX; ly = e.clientY;
    });
    const presets = [
      { c:"#e8d0c4", m:0.8, r:0.12, s:0.6, l:"#88ccff", n:"Pearl" },
      { c:"#ff7aa2", m:0.4, r:0.2, s:1.2, l:"#ffd0e8", n:"Candy" },
      { c:"#2a2e38", m:1, r:0.05, s:0.9, l:"#ffe08a", n:"Oil" },
    ];
    document.querySelectorAll("[data-p]").forEach((b) => b.onclick = () => {
      const p = presets[+b.dataset.p];
      mat.color.set(p.c); document.getElementById("metal").value = p.m;
      document.getElementById("rough").value = p.r; document.getElementById("shape").value = p.s;
      document.getElementById("light").value = p.l; document.getElementById("name").textContent = p.n;
    });
    document.getElementById("remix").onclick = () => document.getElementById("sheet").classList.toggle("on");
    document.getElementById("dl").onclick = () => {
      const a = document.createElement("a"); a.href = renderer.domElement.toDataURL(); a.download = "goo.png"; a.click();
    };
    addEventListener("resize", () => { cam.aspect = innerWidth/innerHeight; cam.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); });
  </script>
</body>
</html>
