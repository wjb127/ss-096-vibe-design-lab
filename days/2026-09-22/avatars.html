<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8" /><meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Facekit</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #f6efe6; color: #2a2118; font-family: ui-sans-serif, system-ui, sans-serif; }
    a.lab { position: fixed; top: 10px; left: 12px; font-size: 11px; color: #8a7b6c; text-decoration: none; }
    main { max-width: 880px; margin: 0 auto; padding: 48px 20px 80px; display: grid; grid-template-columns: 280px 1fr; gap: 24px; }
    h1 { font-size: 22px; margin: 0 0 12px; }
    .preview { background: #fff; border-radius: 24px; padding: 20px; display: grid; place-items: center; }
    svg { width: 240px; height: 240px; }
    label { display: block; font-size: 12px; color: #8a7b6c; margin: 10px 0 6px; }
    .chips { display: flex; flex-wrap: wrap; gap: 6px; }
    .chips button { min-width: 36px; min-height: 32px; border-radius: 999px; border: 1px solid #eadfd2; background: #fff; cursor: pointer; }
    .chips button.on { outline: 2px solid #2a2118; }
    .row { display: flex; gap: 8px; margin-top: 16px; }
    .row button { height: 40px; padding: 0 14px; border-radius: 12px; border: 0; cursor: pointer; font: inherit; }
    .pri { background: #2a2118; color: #fff; }
  </style>
</head>
<body>
  <a class="lab" href="./index.html">← 9/22</a>
  <main>
    <div>
      <h1>Facekit</h1>
      <label>Skin</label><div class="chips" id="skin"></div>
      <label>Hair</label><div class="chips" id="hair"></div>
      <label>Eyes</label><div class="chips" id="eyes"></div>
      <label>Mouth</label><div class="chips" id="mouth"></div>
      <div class="row">
        <button class="pri" type="button" id="rand">Randomize</button>
        <button type="button" id="dl">Download SVG</button>
      </div>
    </div>
    <div class="preview" id="prev"></div>
  </main>
  <script>
    const S = {
      skin: ["#F9DDBD","#EDB98A","#D08B5B","#AE5D29","#614335"],
      hair: ["#2C1B18","#B58143","#E6C287","#4A312C","#F59797"],
      eyes: ["●","◕","^","—"],
      mouth: ["⌣","ω","o","D"],
    };
    const st = { skin: 0, hair: 1, eyes: 0, mouth: 0 };
    function chips(id, arr, paint) {
      const el = document.getElementById(id);
      el.innerHTML = arr.map((v, i) => `<button type="button" class="${st[id]===i?"on":""}" data-i="${i}" style="${id==="skin"||id==="hair"?`background:${v}`:""}">${id==="eyes"||id==="mouth"?v:""}</button>`).join("");
      el.onclick = (e) => { const b = e.target.closest("[data-i]"); if (!b) return; st[id] = +b.dataset.i; render(); };
    }
    function svg() {
      return `<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
        <circle cx="60" cy="62" r="36" fill="${S.skin[st.skin]}"/>
        <ellipse cx="60" cy="28" rx="32" ry="16" fill="${S.hair[st.hair]}"/>
        <text x="44" y="66" font-size="16">${S.eyes[st.eyes]}</text>
        <text x="68" y="66" font-size="16">${S.eyes[st.eyes]}</text>
        <text x="52" y="84" font-size="16">${S.mouth[st.mouth]}</text>
      </svg>`;
    }
    function render() {
      ["skin","hair","eyes","mouth"].forEach((k) => chips(k, S[k]));
      document.getElementById("prev").innerHTML = svg();
    }
    document.getElementById("rand").onclick = () => {
      Object.keys(st).forEach((k) => { st[k] = Math.floor(Math.random() * S[k].length); });
      render();
    };
    document.getElementById("dl").onclick = () => {
      const blob = new Blob([svg()], { type: "image/svg+xml" });
      const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = "facekit.svg"; a.click();
    };
    render();
  </script>
</body>
</html>
