<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8" /><meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Halo</title>
  <style>
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; font-family: ui-sans-serif, system-ui, sans-serif; background: #0c0d10; color: #eee; }
    a.lab { position: fixed; top: 10px; left: 12px; z-index: 20; font-size: 11px; color: #889; text-decoration: none; }
    canvas { display: block; width: 100%; height: 100%; }
    .glass {
      position: fixed; right: 18px; top: 48px; width: 260px;
      background: #16181ccc; backdrop-filter: blur(16px); border: 1px solid #ffffff14;
      border-radius: 16px; padding: 16px; z-index: 10;
    }
    h1 { font-size: 22px; letter-spacing: -0.04em; margin: 0 0 12px; }
    label { display: block; font-size: 11px; color: #9aa; margin: 10px 0 4px; letter-spacing: .06em; text-transform: uppercase; }
    input, select { width: 100%; }
    .chips { display: flex; gap: 6px; flex-wrap: wrap; }
    .chips button, .glass button.act { height: 28px; padding: 0 10px; border-radius: 999px; border: 1px solid #333; background: #1c1e24; color: #eee; cursor: pointer; }
    .hint { font-size: 11px; color: #778; margin-top: 10px; }
  </style>
</head>
<body>
  <a class="lab" href="./index.html">← 9/22</a>
  <div class="glass">
    <h1>Halo</h1>
    <label>Shape</label>
    <select id="shape"><option value="plane">plane</option><option value="sphere">sphere</option><option value="water">water-plane</option></select>
    <label>Colors</label>
    <input type="color" id="c1" value="#9bb4c8" />
    <input type="color" id="c2" value="#3a4a5c" />
    <input type="color" id="c3" value="#e8eef4" />
    <label>Speed</label><input type="range" id="speed" min="0" max="2" step="0.01" value="0.4" />
    <label>Noise</label><input type="range" id="noise" min="0" max="2" step="0.01" value="0.7" />
    <label>Presets</label>
    <div class="chips">
      <button type="button" data-pre="halo">Halo</button>
      <button type="button" data-pre="sunset">Sunset</button>
      <button type="button" id="rand">Randomize</button>
    </div>
    <button class="act" type="button" id="copy" style="width:100%;margin-top:10px">Copy link</button>
    <p class="hint">드래그 궤도 · 스크롤 줌</p>
  </div>
  <script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.160.1/build/three.module.js"}}</script>
  <script type="module">
    import * as THREE from "three";
    const scene = new THREE.Scene();
    const cam = new THREE.PerspectiveCamera(40, innerWidth/innerHeight, 0.1, 40);
    cam.position.set(0, 0, 4);
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(innerWidth, innerHeight); document.body.prepend(renderer.domElement);
    const uniforms = {
      t: { value: 0 }, c1: { value: new THREE.Color("#9bb4c8") },
      c2: { value: new THREE.Color("#3a4a5c") }, c3: { value: new THREE.Color("#e8eef4") },
      noise: { value: 0.7 }, speed: { value: 0.4 }
    };
    const mat = new THREE.ShaderMaterial({
      uniforms,
      vertexShader: `varying vec3 v; uniform float t; uniform float noise; uniform float speed;
        void main(){ v=position; vec3 p=position; p.z += sin(p.x*3.0+t*speed*2.0)*0.12*noise; gl_Position=projectionMatrix*modelViewMatrix*vec4(p,1.0); }`,
      fragmentShader: `varying vec3 v; uniform vec3 c1; uniform vec3 c2; uniform vec3 c3; uniform float t;
        void main(){ float f=0.5+0.5*sin(v.x*2.0+t)+0.25*cos(v.y*3.0); vec3 col=mix(c1,c2,f); col=mix(col,c3,smoothstep(-0.2,0.8,v.y)); gl_FragColor=vec4(col,1.0); }`
    });
    let mesh = new THREE.Mesh(new THREE.PlaneGeometry(4, 4, 64, 64), mat); scene.add(mesh);
    function setShape(s) {
      scene.remove(mesh);
      const g = s==="sphere" ? new THREE.SphereGeometry(1.4, 64, 64) : new THREE.PlaneGeometry(4, 4, 80, 80);
      mesh = new THREE.Mesh(g, mat); scene.add(mesh);
    }
    const q = new URLSearchParams(location.search);
    ["c1","c2","c3","speed","noise","shape"].forEach((k) => { if (q.get(k)) document.getElementById(k).value = q.get(k); });
    if (q.get("shape")) setShape(q.get("shape"));
    function sync() {
      uniforms.c1.value.set(c1.value); uniforms.c2.value.set(c2.value); uniforms.c3.value.set(c3.value);
      uniforms.speed.value = +speed.value; uniforms.noise.value = +noise.value;
    }
    ["c1","c2","c3","speed","noise"].forEach((id) => document.getElementById(id).oninput = sync);
    document.getElementById("shape").onchange = (e) => setShape(e.target.value);
    document.querySelector("[data-pre=halo]").onclick = () => { c1.value="#9bb4c8"; c2.value="#3a4a5c"; c3.value="#e8eef4"; speed.value=0.35; noise.value=0.6; sync(); };
    document.querySelector("[data-pre=sunset]").onclick = () => { c1.value="#ff7a59"; c2.value="#3a1c4a"; c3.value="#ffd09a"; speed.value=0.5; noise.value=0.9; sync(); };
    document.getElementById("rand").onclick = () => {
      [c1,c2,c3].forEach((el) => el.value = "#"+Math.floor(Math.random()*0xffffff).toString(16).padStart(6,"0"));
      speed.value = Math.random(); noise.value = Math.random()*1.5; sync();
    };
    document.getElementById("copy").onclick = async () => {
      const p = new URLSearchParams({ c1:c1.value,c2:c2.value,c3:c3.value,speed:speed.value,noise:noise.value,shape:shape.value });
      history.replaceState(null,"","?"+p);
      await navigator.clipboard.writeText(location.href).catch(()=>{});
      document.getElementById("copy").textContent = "Copied";
    };
    let drag=false, lx=0, ly=0, rot={x:0.3,y:0.2};
    addEventListener("pointerdown",(e)=>{drag=true;lx=e.clientX;ly=e.clientY;});
    addEventListener("pointerup",()=>drag=false);
    addEventListener("pointermove",(e)=>{ if(!drag)return; rot.y+=(e.clientX-lx)*0.005; rot.x+=(e.clientY-ly)*0.005; lx=e.clientX; ly=e.clientY; });
    addEventListener("wheel",(e)=>{ cam.position.z = Math.min(8, Math.max(2, cam.position.z + e.deltaY*0.01)); });
    function loop(){ uniforms.t.value += 0.016; mesh.rotation.set(rot.x, rot.y, 0); renderer.render(scene,cam); requestAnimationFrame(loop); }
    sync(); loop();
    addEventListener("resize",()=>{ cam.aspect=innerWidth/innerHeight; cam.updateProjectionMatrix(); renderer.setSize(innerWidth,innerHeight); });
  </script>
</body>
</html>
