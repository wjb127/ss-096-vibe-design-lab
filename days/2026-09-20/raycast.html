<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Flint</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      font-family: Inter, ui-sans-serif, system-ui, sans-serif;
      color: #ececec;
      background:
        radial-gradient(900px 500px at 20% 10%, #2a3350 0%, transparent 55%),
        radial-gradient(800px 600px at 90% 80%, #1c2838 0%, transparent 50%),
        #0b0d12;
    }
    a.lab { position: fixed; top: 10px; left: 12px; font-size: 11px; color: #8b90a0; text-decoration: none; z-index: 20; }
    .hint {
      position: fixed; top: 18px; right: 18px; color: #8b90a0; font-size: 12px;
    }
    kbd {
      font: 500 11px Inter, sans-serif;
      border: 1px solid #3a3f4d; background: #1a1d26; color: #c8ccd6;
      padding: 2px 6px; border-radius: 5px;
    }
    .pal {
      width: min(640px, calc(100% - 32px));
      margin: 18vh auto 0;
      background: rgba(28, 30, 38, 0.72);
      backdrop-filter: blur(28px) saturate(1.3);
      -webkit-backdrop-filter: blur(28px) saturate(1.3);
      border: 1px solid rgba(255,255,255,.08);
      border-radius: 14px;
      box-shadow:
        0 1px 0 rgba(255,255,255,.06) inset,
        0 30px 80px rgba(0,0,0,.45);
      overflow: hidden;
    }
    .search {
      display: flex; align-items: center; gap: 10px;
      padding: 14px 16px 12px;
      border-bottom: 1px solid rgba(255,255,255,.06);
    }
    .search svg { flex: 0 0 auto; opacity: .55; }
    .search input {
      flex: 1; border: 0; outline: 0; background: transparent;
      color: #fff; font: 500 18px/1.3 Inter, sans-serif; letter-spacing: -0.02em;
    }
    .search input::placeholder { color: #6f7482; font-weight: 400; }
    .list { padding: 6px; max-height: 380px; overflow: auto; }
    .sec { font-size: 11px; color: #8b90a0; padding: 8px 10px 4px; }
    .item {
      display: grid; grid-template-columns: 32px 1fr auto;
      gap: 10px; align-items: center;
      padding: 8px 10px; border-radius: 8px; cursor: pointer;
    }
    .item.on { background: rgba(255,255,255,.08); }
    .ico {
      width: 32px; height: 32px; border-radius: 8px;
      display: grid; place-items: center; font-size: 14px;
      background: #2a2e3a; border: 1px solid rgba(255,255,255,.06);
    }
    .t { font-size: 13.5px; font-weight: 500; letter-spacing: -0.01em; }
    .s { font-size: 12px; color: #8b90a0; margin-top: 1px; }
    .tag { font-size: 11px; color: #6f7482; }
    .empty { padding: 36px 16px; text-align: center; color: #8b90a0; }
    .empty strong { display: block; color: #ddd; margin-bottom: 6px; font-weight: 500; }
    .foot {
      display: flex; align-items: center; gap: 14px;
      padding: 8px 14px; font-size: 11px; color: #8b90a0;
      border-top: 1px solid rgba(255,255,255,.06);
    }
    .foot span { margin-left: auto; }
    .toast {
      width: min(640px, calc(100% - 32px));
      margin: 12px auto 0;
      background: rgba(28,30,38,.85);
      border: 1px solid rgba(255,255,255,.08);
      border-radius: 10px; padding: 10px 14px; font-size: 13px;
      display: none;
    }
    .toast.on { display: block; }
    .actions {
      display: none; padding: 6px; border-top: 1px solid rgba(255,255,255,.06);
    }
    .actions.on { display: block; }
  </style>
</head>
<body>
  <a class="lab" href="./index.html">← 9/20</a>
  <div class="hint">검색 후 <kbd>↑</kbd> <kbd>↓</kbd> <kbd>Enter</kbd> · <kbd>⌘K</kbd> 액션</div>
  <div class="pal" role="dialog" aria-label="명령 팔레트">
    <div class="search">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="11" cy="11" r="7" stroke="#c8ccd6" stroke-width="1.8"/><path d="M20 20l-3.2-3.2" stroke="#c8ccd6" stroke-width="1.8" stroke-linecap="round"/></svg>
      <input id="q" type="search" placeholder="Search for apps and commands…" autocomplete="off" autofocus />
    </div>
    <div class="list" id="list"></div>
    <div class="actions" id="actions"></div>
    <div class="foot">
      <span><kbd>↵</kbd> Open</span>
      <span><kbd>⌘</kbd><kbd>K</kbd> Actions</span>
      <span id="count"></span>
    </div>
  </div>
  <div class="toast" id="toast" role="status"></div>
  <script>
    const ITEMS = [
      { t: "Clipboard History", s: "Paste from recent clips", g: "Suggested", ico: "📋", k: "clip paste 클립보드" },
      { t: "Window Management", s: "Left half · Center · Maximize", g: "Suggested", ico: "🪟", k: "window 창" },
      { t: "Create Snippet", s: "Insert text with a keyword", g: "Suggested", ico: "✂️", k: "snippet 스니펫" },
      { t: "Search Files", s: "Find a file on this Mac", g: "Commands", ico: "📁", k: "file finder 파일" },
      { t: "Emoji", s: "Search and copy emoji", g: "Commands", ico: "☺", k: "emoji 이모지" },
      { t: "Confetti", s: "Celebrate something", g: "Commands", ico: "🎉", k: "confetti" },
      { t: "Linear · Create Issue", s: "Open a new issue", g: "Extensions", ico: "L", k: "linear issue" },
      { t: "Notion · Search", s: "Jump to a page", g: "Extensions", ico: "N", k: "notion" },
      { t: "Spotify · Now Playing", s: "Control playback", g: "Extensions", ico: "♫", k: "spotify music" },
      { t: "Calendar · Next Meeting", s: "Join or copy the link", g: "Extensions", ico: "📅", k: "calendar zoom meet 회의" },
      { t: "Translate", s: "ko ↔ en", g: "Extensions", ico: "文", k: "translate 번역" },
      { t: "Quit Application", s: "Close the frontmost app", g: "System", ico: "⏻", k: "quit 종료" },
    ];
    let q = "", idx = 0, actionOpen = false, actionIdx = 0;
    const ACTIONS = ["Open", "Copy Name", "Show in Finder"];

    function filtered() {
      const n = q.trim().toLowerCase();
      if (!n) return ITEMS.filter((i) => i.g === "Suggested").concat(ITEMS.filter((i) => i.g !== "Suggested"));
      return ITEMS.filter((i) => (i.t + " " + i.s + " " + i.k).toLowerCase().includes(n));
    }
    function toast(m) {
      const el = document.getElementById("toast");
      el.textContent = m; el.classList.add("on");
      clearTimeout(toast._t); toast._t = setTimeout(() => el.classList.remove("on"), 1600);
    }
    function render() {
      const rows = filtered();
      const list = document.getElementById("list");
      const idle = !q.trim();
      if (!rows.length) {
        list.innerHTML = `<div class="empty"><strong>No results</strong>‘${q}’에 맞는 명령이 없습니다.</div>`;
        document.getElementById("count").textContent = "0";
        document.getElementById("actions").classList.remove("on");
        return;
      }
      if (idx >= rows.length) idx = rows.length - 1;
      let html = idle ? `<div class="sec">Suggested</div>` : `<div class="sec">Results</div>`;
      let last = idle ? "Suggested" : "";
      rows.forEach((r, i) => {
        if (idle && r.g !== last && r.g !== "Suggested") {
          html += `<div class="sec">${r.g}</div>`; last = r.g;
        }
        html += `<div class="item ${i === idx ? "on" : ""}" data-i="${i}">
          <div class="ico">${r.ico}</div>
          <div><div class="t">${r.t}</div><div class="s">${r.s}</div></div>
          <div class="tag">${i === idx ? "Open" : ""}</div>
        </div>`;
      });
      list.innerHTML = html;
      document.getElementById("count").textContent = rows.length + " commands";
      const act = document.getElementById("actions");
      if (actionOpen) {
        act.classList.add("on");
        act.innerHTML = ACTIONS.map((a, i) =>
          `<div class="item ${i === actionIdx ? "on" : ""}" data-a="${i}"><div class="ico">▸</div><div class="t">${a}</div></div>`
        ).join("");
      } else act.classList.remove("on");
      list.querySelector(".item.on")?.scrollIntoView({ block: "nearest" });
    }
    function run(kind) {
      const item = filtered()[idx];
      if (!item) return;
      toast((kind || "Open") + " · " + item.t);
      actionOpen = false;
      render();
    }
    document.getElementById("q").addEventListener("input", (e) => {
      q = e.target.value; idx = 0; actionOpen = false; render();
    });
    document.getElementById("list").addEventListener("mousemove", (e) => {
      const it = e.target.closest(".item"); if (!it) return;
      idx = +it.dataset.i; render();
    });
    document.getElementById("list").addEventListener("click", (e) => {
      const it = e.target.closest(".item"); if (!it) return;
      idx = +it.dataset.i; run("Open");
    });
    document.getElementById("actions").addEventListener("click", (e) => {
      const it = e.target.closest("[data-a]"); if (!it) return;
      run(ACTIONS[+it.dataset.a]);
    });
    document.addEventListener("keydown", (e) => {
      const rows = filtered();
      if (e.key === "ArrowDown") {
        e.preventDefault();
        if (actionOpen) actionIdx = Math.min(ACTIONS.length - 1, actionIdx + 1);
        else idx = Math.min(rows.length - 1, idx + 1);
        render();
      } else if (e.key === "ArrowUp") {
        e.preventDefault();
        if (actionOpen) actionIdx = Math.max(0, actionIdx - 1);
        else idx = Math.max(0, idx - 1);
        render();
      } else if (e.key === "Enter") {
        e.preventDefault();
        if (actionOpen) run(ACTIONS[actionIdx]); else run("Open");
      } else if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "k") {
        e.preventDefault();
        actionOpen = !actionOpen; actionIdx = 0; render();
      } else if (e.key === "Escape") {
        if (actionOpen) { actionOpen = false; render(); }
        else { q = ""; document.getElementById("q").value = ""; idx = 0; render(); }
      }
    });
    render();
    document.getElementById("q").focus();
  </script>
</body>
</html>
